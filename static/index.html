<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit Converter</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200">
        <div class="max-w-4xl mx-auto px-4 py-4 flex items-center space-x-3">
            <div class="p-2 bg-blue-600 text-white rounded-xl shadow-md">
                <i data-lucide="arrow-left-right" class="w-6 h-6"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold text-slate-900">Unit Converter</h1>
                <p class="text-xs text-slate-500 font-medium">Go Webserver Client Interface</p>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-4 py-8 w-full flex-grow">
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

            <!-- 1. LENGTH FORM -->
            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col justify-between">
                <div>
                    <div class="flex items-center gap-2 pb-4 border-b border-slate-100 mb-5">
                        <span class="p-2 bg-blue-50 text-blue-600 rounded-lg"><i data-lucide="ruler" class="w-5 h-5"></i></span>
                        <h2 class="text-base font-bold text-slate-900">Length Converter</h2>
                    </div>

                    <form id="length-form" class="space-y-4">
                        <!-- Value Input -->
                        <div>
                            <label for="length-value" class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Value</label>
                            <input type="number" step="any" id="length-value" name="value" required placeholder="Enter value..." 
                                class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 font-semibold focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all">
                        </div>

                        <!-- From Unit -->
                        <div>
                            <label for="length-from" class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">From Unit</label>
                            <select id="length-from" name="from" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 font-medium focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white cursor-pointer">
                                <option value="millimeter">Millimeter (mm)</option>
                                <option value="centimeter">Centimeter (cm)</option>
                                <option value="meter" selected>Meter (m)</option>
                                <option value="kilometer">Kilometer (km)</option>
                                <option value="inch">Inch (in)</option>
                                <option value="foot">Foot (ft)</option>
                                <option value="yard">Yard (yd)</option>
                                <option value="mile">Mile (mi)</option>
                            </select>
                        </div>

                        <!-- To Unit -->
                        <div>
                            <label for="length-to" class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">To Unit</label>
                            <select id="length-to" name="to" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 font-medium focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white cursor-pointer">
                                <option value="millimeter">Millimeter (mm)</option>
                                <option value="centimeter">Centimeter (cm)</option>
                                <option value="meter">Meter (m)</option>
                                <option value="kilometer" selected>Kilometer (km)</option>
                                <option value="inch">Inch (in)</option>
                                <option value="foot">Foot (ft)</option>
                                <option value="yard">Yard (yd)</option>
                                <option value="mile">Mile (mi)</option>
                            </select>
                        </div>

                        <!-- Submit Button -->
                        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 px-4 rounded-xl shadow-md shadow-blue-500/10 transition-all flex items-center justify-center gap-2">
                            <i data-lucide="send" class="w-4 h-4"></i> Convert Length
                        </button>
                    </form>
                </div>

                <!-- Result Box -->
                <div id="length-result" class="mt-5 p-4 bg-blue-50/70 border border-blue-100 rounded-xl">
                    <span class="text-[10px] font-bold text-blue-700 uppercase tracking-wider block">Result</span>
                    <div id="length-result-value" class="text-xl font-bold text-slate-900 mt-0.5 break-all">---</div>
                </div>
            </div>

            <!-- 2. WEIGHT FORM -->
            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col justify-between">
                <div>
                    <div class="flex items-center gap-2 pb-4 border-b border-slate-100 mb-5">
                        <span class="p-2 bg-emerald-50 text-emerald-600 rounded-lg"><i data-lucide="weight" class="w-5 h-5"></i></span>
                        <h2 class="text-base font-bold text-slate-900">Weight Converter</h2>
                    </div>

                    <form id="weight-form" class="space-y-4">
                        <!-- Value Input -->
                        <div>
                            <label for="weight-value" class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Value</label>
                            <input type="number" step="any" id="weight-value" name="value" required placeholder="Enter value..." 
                                class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 font-semibold focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition-all">
                        </div>

                        <!-- From Unit -->
                        <div>
                            <label for="weight-from" class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">From Unit</label>
                            <select id="weight-from" name="from" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 font-medium focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white cursor-pointer">
                                <option value="milligram">Milligram (mg)</option>
                                <option value="gram">Gram (g)</option>
                                <option value="kilogram" selected>Kilogram (kg)</option>
                                <option value="ounce">Ounce (oz)</option>
                                <option value="pound">Pound (lb)</option>
                            </select>
                        </div>

                        <!-- To Unit -->
                        <div>
                            <label for="weight-to" class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">To Unit</label>
                            <select id="weight-to" name="to" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 font-medium focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white cursor-pointer">
                                <option value="milligram">Milligram (mg)</option>
                                <option value="gram">Gram (g)</option>
                                <option value="kilogram">Kilogram (kg)</option>
                                <option value="ounce">Ounce (oz)</option>
                                <option value="pound" selected>Pound (lb)</option>
                            </select>
                        </div>

                        <!-- Submit Button -->
                        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 px-4 rounded-xl shadow-md shadow-emerald-500/10 transition-all flex items-center justify-center gap-2">
                            <i data-lucide="send" class="w-4 h-4"></i> Convert Weight
                        </button>
                    </form>
                </div>

                <!-- Result Box -->
                <div id="weight-result" class="mt-5 p-4 bg-emerald-50/70 border border-emerald-100 rounded-xl">
                    <span class="text-[10px] font-bold text-emerald-700 uppercase tracking-wider block">Result</span>
                    <div id="weight-result-value" class="text-xl font-bold text-slate-900 mt-0.5 break-all">---</div>
                </div>
            </div>

            <!-- 3. TEMPERATURE FORM -->
            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col justify-between">
                <div>
                    <div class="flex items-center gap-2 pb-4 border-b border-slate-100 mb-5">
                        <span class="p-2 bg-rose-50 text-rose-600 rounded-lg"><i data-lucide="thermometer" class="w-5 h-5"></i></span>
                        <h2 class="text-base font-bold text-slate-900">Temperature</h2>
                    </div>

                    <form id="temperature-form" class="space-y-4">
                        <!-- Value Input -->
                        <div>
                            <label for="temperature-value" class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Value</label>
                            <input type="number" step="any" id="temperature-value" name="value" required placeholder="Enter value..." 
                                class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 font-semibold focus:outline-none focus:ring-2 focus:ring-rose-500 focus:bg-white transition-all">
                        </div>

                        <!-- From Unit -->
                        <div>
                            <label for="temperature-from" class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">From Unit</label>
                            <select id="temperature-from" name="from" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 font-medium focus:outline-none focus:ring-2 focus:ring-rose-500 focus:bg-white cursor-pointer">
                                <option value="celsius" selected>Celsius (°C)</option>
                                <option value="fahrenheit">Fahrenheit (°F)</option>
                                <option value="kelvin">Kelvin (K)</option>
                            </select>
                        </div>

                        <!-- To Unit -->
                        <div>
                            <label for="temperature-to" class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">To Unit</label>
                            <select id="temperature-to" name="to" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 font-medium focus:outline-none focus:ring-2 focus:ring-rose-500 focus:bg-white cursor-pointer">
                                <option value="celsius">Celsius (°C)</option>
                                <option value="fahrenheit" selected>Fahrenheit (°F)</option>
                                <option value="kelvin">Kelvin (K)</option>
                            </select>
                        </div>

                        <!-- Submit Button -->
                        <button type="submit" class="w-full bg-rose-600 hover:bg-rose-700 text-white font-semibold py-2.5 px-4 rounded-xl shadow-md shadow-rose-500/10 transition-all flex items-center justify-center gap-2">
                            <i data-lucide="send" class="w-4 h-4"></i> Convert Temp
                        </button>
                    </form>
                </div>

                <!-- Result Box -->
                <div id="temperature-result" class="mt-5 p-4 bg-rose-50/70 border border-rose-100 rounded-xl">
                    <span class="text-[10px] font-bold text-rose-700 uppercase tracking-wider block">Result</span>
                    <div id="temperature-result-value" class="text-xl font-bold text-slate-900 mt-0.5 break-all">---</div>
                </div>
            </div>

        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-4">
        <div class="max-w-4xl mx-auto px-4 text-center text-xs text-slate-400">
            Unit Converter HTML Form Template
        </div>
    </footer>

    <!-- Empty Script section with Form Reference Map for custom JS integration -->
    <script>
        // Initialize UI icons
        window.addEventListener('DOMContentLoaded', () => {
            if (window.lucide) lucide.createIcons();
        });

        document.getElementById('length-form').addEventListener('submit', async function(event) {
            event.preventDefault();

            const results = document.getElementById('length-result-value');
            const formData = new URLSearchParams(new FormData(document.getElementById('length-form')));
            
            try {
                const response = await fetch('/length', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: formData
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    results.textContent = data;
                } else {
                    results.textContent = 'Error: ' + data.error;
                }
            } catch (error) {
                console.error('Error:', error);
            }
        });

        document.getElementById('weight-form').addEventListener('submit', async function(event) {
            event.preventDefault();

            const results = document.getElementById('weight-result-value');
            const formData = new URLSearchParams(new FormData(document.getElementById('weight-form')));
            
            try {
                const response = await fetch('/weight', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: formData
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    results.textContent = data;
                } else {
                    results.textContent = 'Error: ' + data.error;
                }
            } catch (error) {
                console.error('Error:', error);
            }
        });

        document.getElementById('temperature-form').addEventListener('submit', async function(event) {
            event.preventDefault();

            const results = document.getElementById('temperature-result-value');
            const formData = new URLSearchParams(new FormData(document.getElementById('temperature-form')));
            
            try {
                const response = await fetch('/temperature', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: formData
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    results.textContent = data;
                } else {
                    results.textContent = 'Error: ' + data.error;
                }
            } catch (error) {
                console.error('Error:', error);
            }
        });
    </script>
</body>
</html>
